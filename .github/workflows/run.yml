name: Bot Trading Exchange

on:
  schedule:
    # Esegue il bot ogni giorno alle 06:30 UTC (corrispondenti alle 08:30 in Italia)
    - cron: '30 6 * * *'
  workflow_dispatch: # Mantiene attivo anche il pulsante per il test manuale

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run bot script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
